<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Desktop Required</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: #1c1c1e;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .icon {
        font-size: 56px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      p {
        color: #a1a1a6;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">💻</div>
      <h1>
        For the best experience, please view this document on your laptop or
        desktop.
      </h1>
      <p>Your current device isn't supported for this document.</p>
    </div>
  </body>
</html>
